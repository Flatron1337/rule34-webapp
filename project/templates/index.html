<!-- project/templates/index.html -->
{% extends "base.html" %}
{% block title %}Поиск по Rule34{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card bg-dark text-white shadow-lg">
            <div class="card-body p-5 text-center">
                <h1 class="card-title mb-4">Поиск по Rule34</h1>
                <form action="{{ url_for('gallery.show_gallery') }}" method="get">
                    <div class="mb-3">
                        <!-- Добавлен класс awesomplete и id="tags-input" -->
                        <input type="text" class="form-control form-control-lg awesomplete" id="tags-input" name="tags" placeholder="например, genshin_impact raidenshogun" required>
                    </div>
                    <div class="mb-4">
                        <input type="text" class="form-control" name="blacklist" placeholder="Персональный черный список (через пробел)">
                    </div>
                    <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                        <button type="submit" class="btn btn-primary btn-lg px-4 gap-3">🔍 Искать</button>
                        <a href="{{ url_for('main.random_post') }}" class="btn btn-outline-light btn-lg px-4">🎲 Случайный пост</a>
                    </div>
                </form>
                
                {% if history %}
                <hr class="my-4">
                <h5 class="text-white-50">История поиска:</h5>
                <div>
                    {% for item in history %}
                        <a href="{{ url_for('gallery.show_gallery', tags=item) }}" class="btn btn-sm btn-outline-secondary m-1">{{ item }}</a>
                    {% endfor %}
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const input = document.getElementById("tags-input");
    const awesomplete = new Awesomplete(input, {
        minChars: 2, // Начинать поиск после ввода 2 символов
        list: []     // Изначально список пуст
    });

    input.addEventListener("input", async function() {
        // Получаем последнее слово из строки ввода
        const parts = this.value.split(" ");
        const currentTag = parts[parts.length - 1];

        if (currentTag.length < awesomplete.minChars) {
            return;
        }

        // Отправляем запрос на наш API
        try {
            const response = await fetch(`/api/autocomplete?q=${encodeURIComponent(currentTag)}`);
            const suggestions = await response.json();
            // Обновляем список подсказок в библиотеке
            awesomplete.list = suggestions;
        } catch (error) {
            console.error("Autocomplete error:", error);
        }
    });
});
</script>
{% endblock %}
