<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rule34 WebApp{% endblock %}</title>
    <!-- Эмодзи иконка -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
      .masonry-grid { column-count: 4; column-gap: 1rem; }
      .masonry-item { break-inside: avoid; margin-bottom: 1rem; position: relative; }
      @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
      @media (max-width: 768px) { .masonry-grid { column-count: 2; } }
      @media (max-width: 480px) { .masonry-grid { column-count: 1; } }

      .post-media { width: 100%; height: auto; display: block; border-radius: 4px; cursor: pointer; transition: opacity 0.2s; }
      .post-media:hover { opacity: 0.9; }
      
      .fav-btn {
        position: absolute; top: 10px; right: 10px;
        background: rgba(0,0,0,0.5); border: none; border-radius: 50%;
        width: 35px; height: 35px; color: white; transition: all 0.2s; z-index: 10;
        display: flex; align-items: center; justify-content: center;
      }
      .fav-btn.active { color: #ff4d4d; background: rgba(255,255,255,0.2); }
      .fav-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.8); }

      /* Awesomplete */
      div.awesomplete > ul { background-color: #212529 !important; border: 1px solid #495057 !important; color: #adb5bd !important; z-index: 1000; }
      div.awesomplete > ul > li:hover, div.awesomplete > ul > li[aria-selected="true"] { background: #0d6efd !important; color: white !important; }
      div.awesomplete mark { background: none; color: #fff; font-weight: bold; }

      /* Back to Top */
      #btn-back-to-top { position: fixed; bottom: 20px; right: 20px; display: none; z-index: 99; }
      
      /* ИСПРАВЛЕНИЕ: Скролл тегов в лайтбоксе */
      #lightbox-tags {
          max-height: 120px;
          overflow-y: auto;
          scrollbar-width: thin; /* Firefox */
          scrollbar-color: #6c757d #212529;
      }
      #lightbox-tags::-webkit-scrollbar { width: 6px; }
      #lightbox-tags::-webkit-scrollbar-track { background: #212529; }
      #lightbox-tags::-webkit-scrollbar-thumb { background-color: #6c757d; border-radius: 10px; }
    </style>
  </head>
  <body class="bg-dark-subtle">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 sticky-top shadow">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">R34 <span class="text-primary">App</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}">🔍 Поиск</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('gallery.show_favorites') }}">❤️ Избранное</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <button type="button" class="btn btn-primary btn-lg rounded-circle shadow" id="btn-back-to-top">
      <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
    
    <script>
      let mybutton = document.getElementById("btn-back-to-top");
      window.onscroll = function () {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
          mybutton.style.display = "block";
        } else {
          mybutton.style.display = "none";
        }
      };
      mybutton.addEventListener("click", function () {
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;
      });

      document.addEventListener("DOMContentLoaded", function() {
          const inputs = document.querySelectorAll(".awesomplete-input");
          inputs.forEach(input => {
              const awesomplete = new Awesomplete(input, {
                  minChars: 2, maxItems: 10,
                  filter: function(text, input) { return Awesomplete.FILTER_CONTAINS(text, input.match(/[^ ]*$/)[0]); },
                  replace: function(text) {
                    var before = this.input.value.match(/^.+ \s*|/)[0];
                    this.input.value = before + text + " ";
                  }
              });
              input.addEventListener("input", async function() {
                  const parts = this.value.split(" ");
                  const currentTag = parts[parts.length - 1];
                  if (currentTag.length < 2) return;
                  try {
                      const response = await fetch(`/api/autocomplete?q=${encodeURIComponent(currentTag)}`);
                      awesomplete.list = await response.json();
                  } catch (e) {}
              });
          });
      });
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
