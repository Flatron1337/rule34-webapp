<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по Rule34</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #2c2f33; color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .search-container { text-align: center; background-color: #23272a; padding: 30px 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); width: 100%; max-width: 500px; }
        h1 { margin-bottom: 10px; }
        p { color: #99aab5; }
        .form-group { margin-bottom: 15px; }
        input[type="text"] { width: calc(100% - 24px); padding: 12px; border-radius: 5px; border: 1px solid #4f545c; background-color: #40444b; color: #ffffff; font-size: 16px; }
        .button-group { display: flex; gap: 10px; justify-content: center; }
        button, .random-btn { flex-grow: 1; text-align: center; text-decoration: none; padding: 12px 20px; border-radius: 5px; border: none; background-color: #7289da; color: #ffffff; font-size: 16px; cursor: pointer; transition: background-color 0.2s; }
        button:hover, .random-btn:hover { background-color: #5f73bc; }
        .history { margin-top: 30px; }
        .history h3 { color: #99aab5; }
        .history-tags a { color: #7289da; text-decoration: none; background-color: #40444b; padding: 5px 10px; margin: 3px; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="search-container">
        <h1>Поиск по Rule34</h1>
        <p>Введите теги, разделенные пробелом</p>
        <form action="/gallery" method="get">
            <div class="form-group">
                <input type="text" name="tags" placeholder="например, genshin_impact raidenshogun" required>
            </div>
            <div class="form-group">
                <input type="text" name="blacklist" placeholder="Персональный черный список (через пробел)">
            </div>
            <div class="button-group">
                <button type="submit">🔍 Искать</button>
                <a href="{{ url_for('random_post') }}" class="random-btn">🎲 Случайный пост</a>
            </div>
        </form>
        
        {% if history %}
        <div class="history">
            <h3>История поиска:</h3>
            <div class="history-tags">
                {% for item in history %}
                    <a href="{{ url_for('gallery', tags=item) }}">{{ item }}</a>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
