<!-- project/templates/base.html -->
<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rule34 WebApp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    <style>
      .post-media { width: 100%; height: 300px; object-fit: contain; background-color: #000; cursor: pointer; }

      /* === ФИНАЛЬНЫЕ СТИЛИ ДЛЯ AWESOMPLETE (V3) === */
      /* 1. Стили для самого выпадающего контейнера */
      div.awesomplete > ul {
        background-image: none !important; /* Убираем возможные градиенты */
        background-color: #212529 !important; /* Очень темный фон (Bootstrap dark) */
        border: 1px solid #495057 !important;
        border-radius: 0.375rem !important;
        margin-top: 5px !important;
      }

      /* 2. Стили для каждого элемента списка */
      div.awesomplete > ul > li {
        padding: 0.5rem 1rem !important;
        transition: background-color 0.15s ease-in-out;
        color: #adb5bd !important; /* НЕПОДСВЕЧЕННЫЙ текст делаем серым */
        background: transparent !important; /* Убираем любой фон у самого элемента */
      }

      /* 3. Подсветка совпадающей части текста (тег <mark>) */
      div.awesomplete > ul > li mark {
          background: transparent !important; /* Убираем стандартный желтый фон */
          color: #f8f9fa !important; /* ПОДСВЕЧЕННЫЙ текст делаем ярко-белым */
          font-weight: bold; /* Делаем его жирным для акцента */
          padding: 0;
      }

      /* 4. Стили для элемента при наведении или выборе клавиатурой */
      div.awesomplete > ul > li:hover,
      div.awesomplete > ul > li[aria-selected="true"] {
        background: #0d6efd !important; /* Синий фон Bootstrap */
        color: white !important; /* Весь текст становится белым */
      }
      
      /* Важно: текст внутри <mark> тоже должен стать белым при наведении */
      div.awesomplete > ul > li:hover mark,
      div.awesomplete > ul > li[aria-selected="true"] mark {
          color: white !important;
      }
    </style>
  </head>
  <body class="bg-dark-subtle">
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
