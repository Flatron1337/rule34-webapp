<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rule34 WebApp{% endblock %}</title>
    
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(30, 41, 59, 0.6);
            --surface-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
            --primary-gradient-hover: linear-gradient(135deg, #c084fc 0%, #60a5fa 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(16px);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }

        .glass-panel {
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .text-gradient {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-primary-gradient {
            background: var(--primary-gradient);
            border: none;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
        }
        .btn-primary-gradient:hover {
            background: var(--primary-gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
            color: white;
        }

        .navbar-glass {
            background: rgba(11, 15, 25, 0.7) !important;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--surface-border) !important;
        }

        .masonry-grid { column-count: 4; column-gap: 1rem; }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; position: relative; border-radius: 12px; overflow: hidden; }
        @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 768px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 480px) { .masonry-grid { column-count: 1; } }
        
        .post-media { 
            width: 100%; height: auto; display: block; cursor: pointer; 
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), filter 0.4s ease; 
        }
        .masonry-item:hover .post-media { 
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        
        .fav-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            backdrop-filter: blur(4px);
            width: 38px; height: 38px; color: rgba(255,255,255,0.8); z-index: 10;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .fav-btn.active { color: #ff4d4d; background: rgba(255,255,255,0.1); border-color: rgba(255, 77, 77, 0.3); }
        .fav-btn:hover { transform: scale(1.15); background: rgba(0,0,0,0.85); color: #ff4d4d; }
        
        div.awesomplete > ul { 
            background: var(--surface-color) !important; 
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--surface-border) !important; 
            border-radius: 8px;
            color: var(--text-main) !important; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        div.awesomplete > ul > li:hover, div.awesomplete > ul > li[aria-selected="true"] { 
            background: var(--primary-gradient) !important; 
            color: white !important; 
        }
        
        #btn-back-to-top { 
            position: fixed; bottom: 25px; right: 25px; z-index: 100; 
            width: 50px; height: 50px; border-radius: 50%;
            display: none; align-items: center; justify-content: center;
        }
        
        #lightbox-tags {
            max-height: 130px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #lightbox-tags::-webkit-scrollbar { width: 6px; }
        #lightbox-tags::-webkit-scrollbar-thumb { background: var(--primary-gradient); border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-glass sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center" href="{{ url_for('main.index') }}">
                <img src="{{ url_for('static', filename='favicon.png') }}" alt="Logo" width="42" height="42" class="me-2 rounded-3 shadow-sm">
                R34<span class="text-gradient ms-1">App</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}">🔍 Поиск</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('gallery.show_favorites') }}">❤️ Избранное</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5 pt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <button type="button" class="btn-primary-gradient" id="btn-back-to-top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>

    <script>
        // Back to top
        let mybutton = document.getElementById("btn-back-to-top");
        window.onscroll = function () {
            if (document.body.scrollTop > 30 || document.documentElement.scrollTop > 30) {
                mybutton.style.display = "flex";
            } else {
                mybutton.style.display = "none";
            }
        };
        mybutton.addEventListener("click", () => {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        // Awesomplete: tag autocomplete (space-separated tags)
        document.addEventListener("DOMContentLoaded", function () {
            const inputs = document.querySelectorAll(".awesomplete-input");
            inputs.forEach((input) => {
                const awesomplete = new Awesomplete(input, {
                    minChars: 2,
                    maxItems: 12,
                    autoFirst: true,
                    filter: function (text, inputValue) {
                        const last = inputValue.match(/[^ ]*$/)?.[0] ?? "";
                        return Awesomplete.FILTER_CONTAINS(text, last);
                    },
                    replace: function (text) {
                        const before = this.input.value.match(/^.+\s+|/)?.[0] ?? "";
                        this.input.value = before + text + " ";
                    },
                });

                let timer = null;
                input.addEventListener("input", function () {
                    const parts = this.value.split(" ");
                    const currentTag = (parts[parts.length - 1] || "").trim();
                    if (currentTag.length < 2) return;

                    clearTimeout(timer);
                    timer = setTimeout(async () => {
                        try {
                            const resp = await fetch(`/api/autocomplete?q=${encodeURIComponent(currentTag)}`);
                            if (!resp.ok) return;
                            awesomplete.list = await resp.json();
                        } catch (e) {
                            // Silent fail: autocomplete should not break typing
                        }
                    }, 120);
                });
            });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
