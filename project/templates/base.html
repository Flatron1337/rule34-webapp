<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rule34 WebApp{% endblock %}</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .masonry-grid { column-count: 4; column-gap: 1rem; }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; position: relative; }
        @media (max-width: 1200px) { .masonry-grid { column-count: 3; } }
        @media (max-width: 768px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 480px) { .masonry-grid { column-count: 1; } }
        
        .post-media { width: 100%; height: auto; display: block; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .post-media:hover { opacity: 0.85; }
        
        .fav-btn {
            position: absolute; top: 12px; right: 12px;
            background: rgba(0,0,0,0.6); border: none; border-radius: 50%;
            width: 38px; height: 38px; color: white; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .fav-btn.active { color: #ff4d4d; background: rgba(255,255,255,0.25); }
        .fav-btn:hover { transform: scale(1.15); background: rgba(0,0,0,0.85); }
        
        div.awesomplete > ul { background-color: #212529 !important; border: 1px solid #495057 !important; color: #adb5bd !important; }
        div.awesomplete > ul > li:hover, div.awesomplete > ul > li[aria-selected="true"] { background: #0d6efd !important; color: white !important; }
        
        #btn-back-to-top { position: fixed; bottom: 25px; right: 25px; display: none; z-index: 100; }
        
        #lightbox-tags {
            max-height: 130px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #lightbox-tags::-webkit-scrollbar { width: 6px; }
        #lightbox-tags::-webkit-scrollbar-thumb { background-color: #6c757d; border-radius: 10px; }
    </style>
</head>
<body class="bg-dark">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">R34 <span class="text-primary">App</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('main.index') }}">🔍 Поиск</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('gallery.show_favorites') }}">❤️ Избранное</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container pb-5 pt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <button type="button" class="btn btn-primary btn-lg rounded-circle shadow" id="btn-back-to-top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script>

    <script>
        // Back to top
        let mybutton = document.getElementById("btn-back-to-top");
        window.onscroll = function () {
            mybutton.style.display = (document.body.scrollTop > 30 || document.documentElement.scrollTop > 30) ? "block" : "none";
        };
        mybutton.addEventListener("click", () => {
            window.scrollTo({top: 0, behavior: 'smooth'});
        });

        // Awesomplete: tag autocomplete (space-separated tags)
        document.addEventListener("DOMContentLoaded", function () {
            const inputs = document.querySelectorAll(".awesomplete-input");
            inputs.forEach((input) => {
                const awesomplete = new Awesomplete(input, {
                    minChars: 2,
                    maxItems: 12,
                    autoFirst: true,
                    filter: function (text, inputValue) {
                        const last = inputValue.match(/[^ ]*$/)?.[0] ?? "";
                        return Awesomplete.FILTER_CONTAINS(text, last);
                    },
                    replace: function (text) {
                        const before = this.input.value.match(/^.+\s+|/)?.[0] ?? "";
                        this.input.value = before + text + " ";
                    },
                });

                let timer = null;
                input.addEventListener("input", function () {
                    const parts = this.value.split(" ");
                    const currentTag = (parts[parts.length - 1] || "").trim();
                    if (currentTag.length < 2) return;

                    clearTimeout(timer);
                    timer = setTimeout(async () => {
                        try {
                            const resp = await fetch(`/api/autocomplete?q=${encodeURIComponent(currentTag)}`);
                            if (!resp.ok) return;
                            awesomplete.list = await resp.json();
                        } catch (e) {
                            // Silent fail: autocomplete should not break typing
                        }
                    }, 120);
                });
            });
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
